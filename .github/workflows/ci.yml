name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DACFX_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # The skills CLI (vercel-labs) sends usage telemetry unless told not to.
  DISABLE_TELEMETRY: "1"

jobs:
  # The skills agree with compat.json, and name only DbAiTest APIs that exist in the pinned
  # release: a renamed type in a skill would make every agent write code that does not compile.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Skills match compat.json
        run: node scripts/sync-compat.mjs --check
      - name: Read the pinned DbAiTest release
        id: compat
        run: echo "tag=v$(node -p "require('./compat.json').dbaitest")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dbaitest/db-test
          ref: ${{ steps.compat.outputs.tag }}
          path: .dbtest
      - name: Every DbAiTest identifier exists in the pinned release
        run: node scripts/check-identifiers.mjs --dbtest .dbtest

  # The installer and the generator on every OS and the oldest and current supported Node.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # What users get: the skill's own generator writes a project, and it passes against real
  # containers. Linux only: the hosted Windows and macOS runners do not run Linux containers.
  # The existing-* variants start where the skill does in a user's repository: discovery on a
  # fixture repository must name the expected engine before the project is generated against
  # that repository's own schema.
  scaffold:
    name: scaffold (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mssql
            args: --engines mssql
          - variant: postgres
            args: --engines postgres
          - variant: mysql
            args: --engines mysql
          - variant: all-engines
            args: --engines mssql,postgres,mysql
          - variant: postgres-net8.0
            args: --engines postgres --framework net8.0
          - variant: existing-sqlproj
            fixture: sqlproj-shop
            engine: mssql
            args: --schema dacpac --sqlproj test/fixtures/repos/sqlproj-shop/database/Shop.Database/Shop.Database.sqlproj
          - variant: existing-dacpac
            fixture: sqlproj-shop
            engine: mssql
            prebuild: test/fixtures/repos/sqlproj-shop/database/Shop.Database
            args: --schema dacpac --dacpac test/fixtures/repos/sqlproj-shop/database/Shop.Database/bin/Release/Shop.Database.dacpac
          # The schema folder and exclusions come from discovery itself, as the skill uses them.
          - variant: existing-postgres
            fixture: scripts-postgres
            engine: postgres
            from-discovery: true
          - variant: existing-mysql
            fixture: scripts-mysql
            engine: mysql
            from-discovery: true
          - variant: existing-mssql
            fixture: scripts-mssql
            engine: mssql
            from-discovery: true
          - variant: existing-postgres-excluded
            fixture: scripts-postgres
            engine: postgres
            args: --engines postgres --schema-dir test/fixtures/repos/scripts-postgres/db --exclude-dir seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Discovery names the fixture's engine
        if: matrix.fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
          EXPECTED: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          engine=$(node skills/dbaitest-scaffold/scripts/discover.mjs --root "test/fixtures/repos/$FIXTURE" | jq -r .engine)
          echo "discovered: $engine"
          test "$engine" = "$EXPECTED"
      - name: Build the database project fixture
        if: matrix.prebuild
        run: dotnet build "${{ matrix.prebuild }}" --configuration Release
      - name: Generate the project
        env:
          FIXTURE: ${{ matrix.fixture }}
          FROM_DISCOVERY: ${{ matrix.from-discovery }}
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          if [ "$FROM_DISCOVERY" = "true" ]; then
            root="test/fixtures/repos/$FIXTURE"
            report=$(node skills/dbaitest-scaffold/scripts/discover.mjs --root "$root")
            ARGS="--engines $(jq -r .engine <<<"$report") --schema-dir $root/$(jq -r '.scriptFolders[0].schemaDir' <<<"$report")"
            for exclusion in $(jq -r '.scriptFolders[0].excludeFromSchemaDir[]' <<<"$report"); do
              ARGS="$ARGS --exclude-dir $exclusion"
            done
            echo "from discovery: $ARGS"
          fi
          # shellcheck disable=SC2086 # ARGS is a list of options
          node skills/dbaitest-scaffold/scripts/scaffold.mjs \
            --name Generated.Database.Tests \
            --dir "$RUNNER_TEMP/Generated.Database.Tests" \
            $ARGS
      - name: Run it
        run: dotnet test "$RUNNER_TEMP/Generated.Database.Tests" --configuration Release

  # The skill that adds tests finds the test project a repository already has. It has to find
  # the projects the scaffolder writes, and say what is in them: the class the tests belong in,
  # the engine, and where the schema comes from.
  locate:
    name: locate (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: scripts
            args: --engines postgres --schema-dir test/fixtures/repos/scripts-postgres/db/schema
            kind: scripts
            engine: postgres
            abstract: true
          - variant: dacpac
            args: --engines mssql --schema dacpac --sqlproj test/fixtures/repos/sqlproj-shop/database/Shop.Database/Shop.Database.sqlproj
            kind: dacpac
            engine: mssql
            abstract: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate the project and locate it
        env:
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locate"
          # shellcheck disable=SC2086 # ARGS is a list of options
          node skills/dbaitest-scaffold/scripts/scaffold.mjs \
            --name Located.Database.Tests \
            --dir "$RUNNER_TEMP/locate/Located.Database.Tests" \
            $ARGS
          node skills/dbaitest-add-test/scripts/locate-tests.mjs --root "$RUNNER_TEMP/locate" > "$RUNNER_TEMP/locate.json"
      - name: The report says what is in the project
        env:
          EXPECTED_KIND: ${{ matrix.kind }}
          EXPECTED_ENGINE: ${{ matrix.engine }}
          EXPECTED_ABSTRACT: ${{ matrix.abstract }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/locate.json"
          test "$(jq -r '.testProjects | length' "$report")" = 1
          test "$(jq -r '.testProjects[0].baseTestClass.name' "$report")" = DatabaseTests
          test "$(jq -r '.testProjects[0].baseTestClass.isAbstract' "$report")" = "$EXPECTED_ABSTRACT"
          test "$(jq -r '.testProjects[0].engines | join(",")' "$report")" = "$EXPECTED_ENGINE"
          test "$(jq -r '.testProjects[0].schema.kind' "$report")" = "$EXPECTED_KIND"
          test "$(jq -r '.testProjects[0].testMethods | length' "$report")" -ge 1
          test "$(jq -r '.truncated' "$report")" = false

  # The skill that diagnoses a failing test reads the result file of the run: it has to name the
  # failed test and the engine class it failed in.
  diagnose:
    name: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Generate a project with a failing test
        run: |
          set -euo pipefail
          node skills/dbaitest-scaffold/scripts/scaffold.mjs \
            --name Diagnose.Database.Tests \
            --dir "$RUNNER_TEMP/Diagnose.Database.Tests" \
            --engines postgres \
            --schema-dir test/fixtures/repos/scripts-postgres/db/schema
          cat > "$RUNNER_TEMP/Diagnose.Database.Tests/Failing.cs" <<'CS'
          namespace Diagnose.Database.Tests;

          public abstract partial class DatabaseTests
          {
              [TestMethod]
              public async Task Deliberately_Fails_On_The_Amount()
              {
                  var invoiceId = await Harness.QueryScalarAsync<int>(
                      "INSERT INTO invoices (customer) VALUES (@customer) RETURNING id",
                      [new DbParameterValue("@customer", "ada")], TestContext.CancellationToken);

                  var total = await Harness.QueryScalarAsync<decimal>(
                      "SELECT invoice_total(@invoice)",
                      [new DbParameterValue("@invoice", invoiceId)], TestContext.CancellationToken);

                  Assert.AreEqual(99.99m, total);
              }
          }
          CS
      - name: The report names the failed test and its engine class
        run: |
          set -euo pipefail
          node skills/dbaitest-debug/scripts/diagnose.mjs --project "$RUNNER_TEMP/Diagnose.Database.Tests" > "$RUNNER_TEMP/report.json"
          test "$(jq -r '.outcome' "$RUNNER_TEMP/report.json")" = Failed
          test "$(jq -r '.totals.failed' "$RUNNER_TEMP/report.json")" = 1
          test "$(jq -r '.totals.passed' "$RUNNER_TEMP/report.json")" = 1
          test "$(jq -r '.firstFailure.test' "$RUNNER_TEMP/report.json")" = Deliberately_Fails_On_The_Amount
          test "$(jq -r '.firstFailure.class' "$RUNNER_TEMP/report.json")" = Diagnose.Database.Tests.PostgreSqlDatabaseTests
          jq -e '.firstFailure.message | test("Assertion failed")' "$RUNNER_TEMP/report.json" > /dev/null

  # Every C# example in the references compiles and passes against the fixture whose schema it
  # is written for: an example an agent copies must work.
  reference-snippets:
    name: reference-snippets (${{ matrix.fixture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: sqlproj-shop
            args: --schema dacpac --sqlproj test/fixtures/repos/sqlproj-shop/database/Shop.Database/Shop.Database.sqlproj
          - fixture: scripts-postgres
            args: --engines postgres --schema-dir test/fixtures/repos/scripts-postgres/db/schema
          - fixture: scripts-mysql
            args: --engines mysql --schema-dir test/fixtures/repos/scripts-mysql/database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Generate the project and add the examples
        env:
          FIXTURE: ${{ matrix.fixture }}
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # ARGS is a list of options
          node skills/dbaitest-scaffold/scripts/scaffold.mjs --name Reference.Snippets.Tests --dir "$RUNNER_TEMP/Snippets" $ARGS
          for reference in skills/dbaitest-scaffold/references/writing-tests.md skills/dbaitest-add-test/references/engine-calls.md; do
            node scripts/check-reference-snippets.mjs --fixture "$FIXTURE" --project "$RUNNER_TEMP/Snippets" --reference "$reference"
          done
      - name: Run them
        run: dotnet test "$RUNNER_TEMP/Snippets" --configuration Release

  # The tarball holds only what users need, and installs from npm exactly as from the repository.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The package holds exactly the expected files
        run: node scripts/check-pack.mjs
      - name: Install from the packed tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/dbaitest-skills-*.tgz)
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project" && git init -q
          npm exec --yes --package="$tarball" -- dbaitest-skills add
          test -f .claude/skills/dbaitest-scaffold/SKILL.md
          test -f .agents/skills/dbaitest-scaffold/scripts/scaffold.mjs
          test -f .claude/skills/dbaitest-add-test/SKILL.md
          test -f .agents/skills/dbaitest-add-test/scripts/locate-tests.mjs
          test -f .claude/skills/dbaitest-debug/SKILL.md
          test -f .agents/skills/dbaitest-debug/scripts/diagnose.mjs
          npm exec --yes --package="$tarball" -- dbaitest-skills list | grep -q "dbaitest-scaffold"
          npm exec --yes --package="$tarball" -- dbaitest-skills list | grep -q "dbaitest-add-test"
          npm exec --yes --package="$tarball" -- dbaitest-skills list | grep -q "dbaitest-debug"
          node .agents/skills/dbaitest-scaffold/scripts/scaffold.mjs --name Smoke.Tests --engines postgres --framework net10.0

  # The repository also installs with the vercel-labs skills CLI (`npx skills add dbaitest/agent-skills`).
  skills-cli:
    name: skills-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install with npx skills
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project" && git init -q
          npx --yes skills@1.8.1 add "$GITHUB_WORKSPACE" -a codex -a claude-code -y
          test -f .agents/skills/dbaitest-scaffold/SKILL.md
          test -f .claude/skills/dbaitest-scaffold/SKILL.md
          test -f .agents/skills/dbaitest-scaffold/versions.json
          test -f .agents/skills/dbaitest-add-test/SKILL.md
          test -f .agents/skills/dbaitest-add-test/versions.json
          test -f .agents/skills/dbaitest-debug/SKILL.md
          test -f .agents/skills/dbaitest-debug/versions.json
